name: Community Install Smoke

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-install-smoke
  cancel-in-progress: false

env:
  DUCKDB_VERSION: v2.0.0

jobs:
  smoke:
    name: Install from community and run smoke SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify upstream community catalog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh api repos/duckdb/community-extensions/contents/extensions/finance/description.yml >/tmp/finance-community-entry.json 2>/tmp/catalog.err; then
            echo "finance exists in duckdb/community-extensions."
          else
            cat /tmp/catalog.err
            echo "finance is not published in duckdb/community-extensions." >&2
            exit 1
          fi

      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://install.duckdb.org/${DUCKDB_VERSION}/duckdb-cli-linux-amd64.tar.gz" \
            -o duckdb_cli.tar.gz
          tar -xzf duckdb_cli.tar.gz duckdb
          chmod +x duckdb
          ./duckdb -no-agent --version

      - name: Run community install smoke
        run: ./duckdb -no-agent -batch < examples/community_install_smoke.sql
